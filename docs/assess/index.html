<html lang="en">
<head>

  <meta name="description" content="Bayesian adaptive pre-assessment for the Aggregated Intelligence Posture framework. Three openers and up to five questions per in-scope vector. Client-side, no cookies.">
  <meta name="theme-color" content="#4f46e5">

  <meta property="og:description" content="Bayesian adaptive pre-assessment. Up to 18 questions. Estimated AI Posture with per-vector levels and evidence checklist.">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --bg-alt: #f8f9fa;
      --surface2: #f1f3f5;
      --text: #1a1d24;
      --text-muted: #5a6170;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --border: #e5e7eb;
      --amber: #b45309;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
      --max-width: 760px;
      --radius: 10px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); color: var(--text); background: var(--bg); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }

    .skip-link { position: absolute; left: -9999px; top: 0; background: var(--accent); color: #fff; padding: 0.5rem 1rem; z-index: 100; }
    .skip-link:focus { left: 0; }

    .container { max-width: var(--max-width); margin: 0 auto; padding: 0 1.5rem; }

    nav { border-bottom: 1px solid var(--border); padding: 1rem 0; background: var(--bg); }
    nav .container { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    nav .logo { font-weight: 700; font-size: 1.1rem; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 0.55rem; }
    nav .logo svg { color: var(--accent); flex: 0 0 auto; }
    nav .logo:hover svg { color: var(--accent-hover); }
    nav .links { display: flex; gap: 1.5rem; font-size: 0.9rem; }
    nav .links a { color: var(--text-muted); }
    nav .links a:hover { color: var(--text); text-decoration: none; }

    header.hdr { padding: 2.5rem 0 1rem; text-align: center; }
    header.hdr h1 { font-size: 1.85rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.6rem; }
    header.hdr p { color: var(--text-muted); max-width: 620px; margin: 0 auto; font-size: 0.95rem; }

    .progress {
      position: sticky; top: 0; background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 0; z-index: 5;
    }
    .progress-bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .progress-bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
    .progress-label { font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-top: 0.4rem; }

    main { padding: 2rem 0 4rem; }

    .q-form { animation: fadein 0.15s ease-out; }
    @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .q-header { margin-bottom: 1.25rem; }
    .q-tag {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-family: var(--mono);
      font-weight: 600;
      margin-bottom: 0.6rem;
    }
    .q-text { font-size: 1.25rem; font-weight: 700; line-height: 1.35; letter-spacing: -0.01em; }

    .options-wrap { border: none; padding: 0; }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-alt);
      cursor: pointer;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      transition: border-color 0.1s, background 0.1s;
    }
    .option:hover { border-color: var(--accent); }
    .option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
    .option input { margin-top: 0.3rem; accent-color: var(--accent); flex: 0 0 auto; }

    .q-actions {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 2rem; gap: 1rem;
    }
    .probe-actions { display: flex; flex-direction: column; gap: 0.6rem; margin: 1rem 0; }
    .probe-option { text-align: left; width: 100%; }

    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.7rem 1.25rem;
      border-radius: 6px;
      font-weight: 600; font-size: 0.95rem;
      border: 1px solid transparent;
      cursor: pointer; font-family: inherit;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary { background: transparent; color: var(--accent); border-color: var(--accent); }
    .btn-secondary:hover { background: var(--accent); color: #fff; }
    .btn-ghost { background: transparent; color: var(--text-muted); border-color: transparent; }
    .btn-ghost:hover { color: var(--text); background: var(--bg-alt); }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    /* Result */
    .result { padding: 1rem 0; }
    .result-header { text-align: center; margin-bottom: 1.75rem; }
    .result-tag {
      display: inline-block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-family: var(--mono);
      color: var(--amber);
      background: #fef3c7;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }
    .result-header h2 { font-size: 2rem; color: var(--accent); letter-spacing: -0.02em; font-weight: 800; }
    .result-note { font-size: 0.9rem; color: var(--text-muted); max-width: 540px; margin: 0.5rem auto 0; }

    .vrows { margin-bottom: 1.5rem; }
    .vrow { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem; font-family: var(--mono); font-size: 0.85rem; cursor: help; }
    .vrow .vlabel { width: 9em; color: var(--text-muted); }
    .vrow .vbar { flex: 1; height: 10px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
    .vrow .vbar > span { display: block; height: 100%; background: var(--accent); }
    .vrow .vlevel { width: 6.5em; text-align: right; font-weight: 700; color: var(--text); }
    .na-badge { font-size: 0.7rem; padding: 0.15rem 0.5rem; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 999px; color: var(--text-muted); }

    .constraining { margin: 1rem 0 1.5rem; padding: 1rem; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 4px; font-size: 0.95rem; }
    .sub { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; }

    .result h3 { font-size: 1.1rem; margin: 1.75rem 0 0.5rem; font-weight: 700; }
    .evidence-block { margin-bottom: 1rem; padding: 1rem 1.1rem; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 8px; }
    .evidence-block h4 { font-size: 0.95rem; margin-bottom: 0.35rem; font-weight: 700; color: var(--accent); }
    .evidence-block .assertion { font-style: italic; color: var(--text-muted); margin-bottom: 0.5rem; font-size: 0.9rem; }
    .evidence-block ul { margin-left: 1.25rem; font-size: 0.9rem; }
    .evidence-block ul li { margin-bottom: 0.2rem; }
    .evidence-block .test { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.4rem; }

    .handoff { list-style: none; padding: 0; margin-bottom: 1rem; }
    .handoff li { padding: 0.5rem 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    .handoff li:last-child { border-bottom: none; }

    .artifact-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 0.75rem 0 1.5rem; }
    .artifact-note { font-size: 0.85rem; color: var(--text-muted); margin-top: -0.75rem; margin-bottom: 1.25rem; }

    .report { background: #0f1117; color: #e1e4ed; padding: 1rem 1.25rem; border-radius: 8px; font-family: var(--mono); font-size: 0.8rem; line-height: 1.6; overflow-x: auto; white-space: pre; }

    .not-panel { margin-top: 1.5rem; padding: 0.85rem 1rem; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; }
    .not-panel summary { cursor: pointer; font-weight: 600; color: var(--text); }
    .not-panel ul { margin: 0.6rem 0 0 1.25rem; color: var(--text-muted); }

    .error { padding: 1rem; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; color: #991b1b; }

    footer { border-top: 1px solid var(--border); padding: 2rem 0; font-size: 0.85rem; color: var(--text-muted); text-align: center; }
    footer a { color: var(--text); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px; }
    footer a:hover { text-decoration-color: var(--accent); }

    @media (max-width: 640px) {
      header.hdr h1 { font-size: 1.5rem; }
      .q-text { font-size: 1.1rem; }
      .vrow .vlabel { width: 7em; }
      .vrow .vlevel { width: 5.5em; }
    }

    @media print {
      nav, .progress, footer, .q-actions, .artifact-actions, .artifact-note, .not-panel { display: none !important; }
      body { background: #fff; color: #111827; }
      main { padding: 0; }
      .container { max-width: none; padding: 0; }
      .result { padding: 0; }
      .report { white-space: pre-wrap; color: #111827; background: #fff; border: 1px solid #d1d5db; }
      a { color: #111827; text-decoration: underline; }
    }
  </style>
</head>
