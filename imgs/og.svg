<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e33"/>
      <stop offset="0.55" stop-color="#13152370"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e33"/>
      <stop offset="0.55" stop-color="#131523"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>
  <rect width="1200" height="630" fill="none"/>

  <!-- large watermark mark, right side -->
  <g transform="translate(905 315)" opacity="0.16">
    <circle cx="-70" cy="-40" r="150" fill="none" stroke="#8b87f5" stroke-width="6"/>
    <circle cx="70" cy="-40" r="150" fill="none" stroke="#8b87f5" stroke-width="6"/>
    <circle cx="0" cy="80" r="150" fill="none" stroke="#8b87f5" stroke-width="6"/>
    <circle cx="0" cy="-3" r="18" fill="#8b87f5"/>
  </g>

  <!-- brand lockup, top-left -->
  <g transform="translate(80 84)">
    <rect x="0" y="-26" width="52" height="52" rx="11" fill="#4f46e5"/>
    <g transform="translate(26 0)">
      <circle cx="-7" cy="-4" r="11.5" fill="none" stroke="#ffffff" stroke-width="2.6" opacity="0.8"/>
      <circle cx="7" cy="-4" r="11.5" fill="none" stroke="#ffffff" stroke-width="2.6" opacity="0.8"/>
      <circle cx="0" cy="8" r="11.5" fill="none" stroke="#ffffff" stroke-width="2.6" opacity="0.8"/>
      <circle cx="0" cy="0.5" r="3.6" fill="#ffffff"/>
    </g>
    <text x="70" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-0.5">AI Posture</text>
  </g>

  <!-- eyebrow -->
  <text x="80" y="246" font-family="'SF Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#8b87f5" letter-spacing="3">AGGREGATED INTELLIGENCE POSTURE</text>

  <!-- headline -->
  <text x="78" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Open. Vendor-neutral.</text>
  <text x="78" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5"><tspan fill="#ffffff">Bounded by your </tspan><tspan fill="#8b87f5">weakest</tspan><tspan fill="#ffffff">.</tspan></text>

  <!-- supporting vectors line -->
  <text x="80" y="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#b6bcd0">People. Infrastructure. Regulation.</text>

  <!-- footer rule + url -->
  <rect x="80" y="548" width="1040" height="1.5" fill="#2a2e44"/>
  <text x="80" y="588" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">aiposture.org</text>
  <text x="1120" y="588" text-anchor="end" font-family="'SF Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="20" font-weight="500" fill="#6f76a0">One score. Three vectors. CC BY 4.0</text>
</svg>
